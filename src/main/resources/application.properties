spring.application.name=PetBackend-1

# .env 파일을 환경변수처럼 불러온다 (파일이 없으면 무시)
spring.config.import=optional:file:.env[.properties]

server.port=8181
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 1. HTTP 응답 헤더의 WAS 정보 및 에러 상세 스택트레이스 숨김 (보안 강화)
server.server-header=
server.error.include-message=never
server.error.include-stacktrace=never

# 2. Anthropic API (AI 챗봇 함수 호출용) — 실제 키 값은 .env의 ANTHROPIC_API_KEY에만 작성
anthropic.api-key=${ANTHROPIC_API_KEY:}
# 모델: 크레딧 절약을 위해 sonnet 사용 (claude-sonnet-5 = 최신 Sonnet 별칭, 코드에 하드코딩 금지)
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

# 3. Supabase Storage (숏츠 영상 파일). 업로드는 이 서버만 할 수 있다 —
# service-role 키는 RLS를 무시하는 관리자 키이므로 .env(서버)에만 두고 프론트로 내보내지 않는다.
# 비어 있어도 애플리케이션은 기동하고, 업로드 요청 시점에만 설정 누락을 알린다
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.shorts-bucket=shorts

# 4. PostgreSQL 연결 (비밀번호 및 중요 정보는 .env 주입 처리)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.zvbgzlbhwjxrtmqdvrjw}
spring.datasource.password=${DB_PASSWORD:UQBv8xlW0QMdnxeN}

# Supabase 무료 플랜 커넥션 최적화 (Pooler 생존 타임아웃 단축 설정 포함)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.keepalive-time=30000

# 5. JPA 설정
# 스키마는 docs/schema.sql 기준으로 Supabase에서 직접 관리 — JPA는 검증만 수행 (ddl-auto=none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Boot 3.x (Hibernate 6.x) 호환 물리적 네이밍 전략 및 방언
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 대량 데이터 CUD 작업 시 배치 성능 최적화
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 6. 데이터베이스 초기화(SQL Script) 설정
spring.sql.init.mode=never
spring.sql.init.encoding=utf-8

# 7. MyBatis 매퍼 및 별칭 설정
mybatis.configuration.cache-enabled=false
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.pet.backend

# 8. OAuth2 인증 (Google Login) 설정
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# 9. JWT & Cookie Security
jwt.issuer=shinsunyoung
jwt.secret=${JWT_SECRET:default_jwt_secret_key_for_local_development_environment_only}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
jwt.refresh-valid-time=${JWT_REFRESH_VALID_TIME:604800000}

# 리프레시 토큰 쿠키의 Secure 속성. 기본은 true(배포는 반드시 true).
# LAN 주소(http://192.168.x.x)로 접속해 테스트할 때만 .env에 COOKIE_SECURE=false를 넣어 끈다
app.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# 10. 파일 업로드(Multipart) 및 정적 자원 경로 설정
# 실제 상한(50MB)은 ShortsService가 검사해 400 응답을 주기 위해 Multipart 한도를 60MB로 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

app.upload.base=${UPLOAD_BASE_PATH:/app/upload}
spring.web.resources.static-locations=classpath:/static/,file:${app.upload.base}/

# 11. 다국어(i18n), 템플릿(Thymeleaf) 및 Jackson 설정
spring.messages.basename=messages/message
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

# 12. 외부 서버 연동 (FastAPI AI, Client Timeout, CORS)
# 피부 질환 진단 모델 및 AI 추천용 FastAPI 서버 설정 (SkinAiClient에서 사용)
ai.server.url=${AI_SERVER_URL:http://localhost:8000}
ai.skin.endpoint.predict=/api/v1/predict
ai.skin.endpoint.binary-predict=/api/v1/predict/binary

# HTTP 클라이언트 타임아웃 (이미지/동영상 추론 모델 응답 대기시간을 고려하여 읽기 타임아웃 여유 부여)
app.http.client.connect-timeout=5000
app.http.client.read-timeout=30000

app.ai.openai.api-key=${OPENAI_API_KEY:mock-key}
app.ai.openai.model=gpt-4o-mini

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 13. 로깅 및 DevTools 설정
logging.level.com.pet.backend=debug
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.mybatis=debug

# 14. 카카오 및 기상청 API 설정 (.env 주입 처리)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.oauth.client-id=${KAKAO_OAUTH_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
kma.service-key=${KMA_SERVICE_KEY:}


